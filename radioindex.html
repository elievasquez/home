<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Demo</title>
<style>
  :root { --bg:#f6f7fb; --fg:#151a2b; --muted:#5b6380; --accent:#5b8cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1120; --fg:#e8ebf5; --muted:#9aa3c0; } }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:40px 16px; }
  main { max-width:560px; margin:0 auto; display:grid; gap:24px; }
  h1 { margin:0; font-size:1.8rem; }
  p { margin:0; color:var(--muted); line-height:1.5; }
  .live { color:var(--accent); font-weight:600; letter-spacing:.08em; font-size:.8rem; text-transform:uppercase; }
</style>
</head>
<body>
<main>
  <div>
    <div class="live">● En vivo</div>
    <h1>Radio Demo</h1>
    <p>Pulsa play para escuchar la emisora.</p>
  </div>

  <!-- Reproductor Aloncast -->
  <div style="position:relative;max-width:560px;margin:0 auto;padding-bottom:66%;width:100%"><iframe src="https://player.aloncast.com/e/?u=https%3A%2F%2Fdemo-cd738e.stream.aloncast.com%2Fdemo-cd738e.mp3&amp;n=demo&amp;c=5b8cff" title="demo" scrolling="no" allow="clipboard-write" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe></div>
</main>
</body>
</html>
