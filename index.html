<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Startpage</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER CON IMAGEN Y MENSAJE -->
  <header id="main-header" class="header">
    <div class="overlay">
      <div class="quote-container">
        <p id="quote-text">"La simplicidad es la máxima sofisticación."</p>
        <span id="quote-author">- Leonardo da Vinci</span>
      </div>
      <div class="selector-container">
        <label for="bg-select">Fondo:</label>
        <select id="bg-select">
          <option value="assets/images/bg-tech.png">Tecnología</option>
          <option value="assets/images/bg-cyberpunk.jpg">Cyberpunk</option>
          <option value="assets/images/Foto_de_Trevor_Vannoy_en_Unsplash.jpg">Naturaleza</option>
        </select>
      </div>
    </div>
  </header>

  <!-- CENTRO: BUSCADOR DE GOOGLE -->
  <main class="main-content">
    <form action="https://www.google.com/search" method="GET" class="search-form">
      <input type="text" name="q" placeholder="Buscar en Google o escribir URL..." required autofocus autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
  </main>

  <!-- INFERIOR: NOTICIAS / FEEDS FRIKIS -->
  <footer class="news-section">
    <h2>Últimas Noticias</h2>
    <div id="news-container" class="news-grid">
      <!-- Las noticias se cargan dinámicamente aquí -->
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
