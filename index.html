<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio en vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ====== CONFIGURA AQUÍ TUS COLORES ====== */
  :root{
    --acento:#ff3d6e;      /* color principal (botón, barras) */
    --acento2:#ffb347;     /* color secundario (degradado) */
    --fondo:#0f0f17;
    --tarjeta:rgba(255,255,255,.06);
    --texto:#ffffff;
    --texto-suave:rgba(255,255,255,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;background:var(--fondo);color:var(--texto);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;
  }
  .bg{
    position:fixed;inset:-40px;background-size:cover;background-position:center;
    filter:blur(40px) brightness(.45);transform:scale(1.1);transition:background-image .8s;z-index:0;
  }
  .player{
    position:relative;z-index:1;width:100%;max-width:380px;background:var(--tarjeta);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .estacion{font-weight:800;font-size:15px;letter-spacing:.3px}
  .live{
    display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    background:rgba(255,255,255,.1);padding:5px 10px;border-radius:20px;text-transform:uppercase;
  }
  .live i{width:8px;height:8px;border-radius:50%;background:#888}
  .live.on i{background:#ff2b4a;animation:pulso 1.4s infinite}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,43,74,.7)}70%{box-shadow:0 0 0 8px rgba(255,43,74,0)}100%{box-shadow:0 0 0 0 rgba(255,43,74,0)}}
  .portada{
    width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;
    background:linear-gradient(135deg,var(--acento),var(--acento2));margin-bottom:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .portada img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s}
  .portada .icono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:.9}
  .eq{position:absolute;bottom:14px;right:14px;display:flex;gap:3px;align-items:flex-end;height:22px;opacity:0;transition:opacity .3s}
  .eq.on{opacity:1}
  .eq span{width:4px;background:#fff;border-radius:2px;animation:eq 1s infinite ease-in-out}
  .eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}.eq span:nth-child(4){animation-delay:.6s}
  @keyframes eq{0%,100%{height:4px}50%{height:22px}}
  .info{text-align:center;margin-bottom:20px;min-height:52px}
  .titulo{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artista{font-size:15px;color:var(--texto-suave);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controles{display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .play{
    width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(255,61,110,.45);transition:transform .15s;
  }
  .play:hover{transform:scale(1.06)}.play:active{transform:scale(.95)}
  .play svg{width:30px;height:30px;fill:#fff}
  .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .volumen{display:flex;align-items:center;gap:10px}
  .mute{background:none;border:none;cursor:pointer;padding:4px;display:flex}
  .mute svg{width:22px;height:22px;fill:var(--texto-suave)}
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:none;cursor:pointer;
    background:linear-gradient(to right,var(--acento) var(--v,80%),rgba(255,255,255,.2) var(--v,80%));
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#fff}
  .pie{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--texto-suave)}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="player">
  <div class="top">
    <div class="estacion" id="estacion">Radio en vivo</div>
    <div class="live" id="live"><i></i>En vivo</div>
  </div>

  <div class="portada">
    <div class="icono" id="icono">🎵</div>
    <img id="cover" alt="" style="opacity:0">
    <div class="eq" id="eq"><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="info">
    <div class="titulo" id="titulo">Pulsa play para escuchar</div>
    <div class="artista" id="artista">&nbsp;</div>
  </div>

  <div class="controles">
    <button class="play" id="play" aria-label="Reproducir">
      <svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="volumen">
    <button class="mute" id="mute" aria-label="Silenciar">
      <svg viewBox="0 0 24 24" id="icoVol"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen">
  </div>

  <div class="pie">
    <span id="estado">Detenido</span>
    <span id="oyentes"></span>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ====== CONFIGURACIÓN ====== */
const STREAM  = "https://pstnet4.shoutcastnet.com:40174/stream";
const SERVER  = "https://pstnet4.shoutcastnet.com:40174";
const NOMBRE  = "";        // Nombre de tu emisora. Vacío = usa el del servidor
const REFRESCO = 15000;    // cada cuánto se actualiza la canción (ms)

const $ = id => document.getElementById(id);
const audio = $("audio");
let sonando = false, cancionActual = "", reintentos = 0;

const ICO_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICO_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
const ICO_VOL   = $("icoVol").innerHTML;
const ICO_MUTE  = '<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';

if (NOMBRE) $("estacion").textContent = NOMBRE;

/* ---------- Reproducción ---------- */
function setUI(modo){
  const btn = $("play");
  if (modo === "cargando"){
    btn.innerHTML = '<div class="spinner"></div>'; $("estado").textContent = "Conectando…";
  } else {
    btn.innerHTML = '<svg id="ico" viewBox="0 0 24 24">' + (modo === "play" ? ICO_PAUSE : ICO_PLAY) + '</svg>';
    $("estado").textContent = modo === "play" ? "Reproduciendo" : "Detenido";
  }
  $("live").classList.toggle("on", modo === "play");
  $("eq").classList.toggle("on", modo === "play");
}

function reproducir(){
  sonando = true; setUI("cargando");
  audio.src = STREAM + "?t=" + Date.now();   // siempre conecta en directo
  audio.play().catch(() => { sonando = false; setUI("stop"); });
}
function detener(){
  sonando = false; audio.pause(); audio.removeAttribute("src"); audio.load(); setUI("stop");
}
$("play").onclick = () => sonando ? detener() : reproducir();
audio.addEventListener("playing", () => { reintentos = 0; setUI("play"); });
audio.addEventListener("waiting", () => sonando && setUI("cargando"));
audio.addEventListener("error",   () => {
  if (!sonando) return;
  if (reintentos++ < 5){ $("estado").textContent = "Reconectando…"; setTimeout(reproducir, 3000); }
  else { sonando = false; setUI("stop"); $("estado").textContent = "Sin conexión"; }
});

/* ---------- Volumen ---------- */
const vol = $("vol");
function aplicarVol(){
  audio.volume = vol.value / 100; audio.muted = false;
  vol.style.setProperty("--v", vol.value + "%");
  $("icoVol").innerHTML = vol.value == 0 ? ICO_MUTE : ICO_VOL;
  try { localStorage.setItem("vol40170", vol.value); } catch(e){}
}
try { const g = localStorage.getItem("vol40170"); if (g !== null) vol.value = g; } catch(e){}
vol.oninput = aplicarVol; aplicarVol();
$("mute").onclick = () => {
  audio.muted = !audio.muted;
  $("icoVol").innerHTML = audio.muted ? ICO_MUTE : ICO_VOL;
};

/* ---------- JSONP (evita bloqueos CORS) ---------- */
function jsonp(url, timeout = 8000){
  return new Promise((ok, fail) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(() => { limpiar(); fail("timeout"); }, timeout);
    function limpiar(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { limpiar(); ok(d); };
    s.onerror = () => { limpiar(); fail("error"); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.body.appendChild(s);
  });
}

/* ---------- Canción actual ---------- */
async function actualizar(){
  try {
    const d = await jsonp(SERVER + "/stats?sid=1&json=1");
    if (!NOMBRE && d.servertitle) $("estacion").textContent = d.servertitle;
    if (d.currentlisteners !== undefined) $("oyentes").textContent = "👥 " + d.currentlisteners + " oyentes";
    mostrarCancion(d.songtitle || "");
  } catch(e){
    if (!cancionActual) { $("titulo").textContent = "Transmisión en vivo"; }
  }
}

function mostrarCancion(texto){
  texto = texto.trim();
  if (!texto || texto === cancionActual) return;
  cancionActual = texto;
  let artista = "", titulo = texto;
  const i = texto.indexOf(" - ");
  if (i > 0){ artista = texto.slice(0, i); titulo = texto.slice(i + 3); }
  $("titulo").textContent = titulo;
  $("artista").textContent = artista || "\u00a0";
  document.title = titulo + (artista ? " · " + artista : "");
  buscarPortada(artista, titulo);
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: titulo, artist: artista, album: $("estacion").textContent });
  }
}

async function buscarPortada(artista, titulo){
  const cover = $("cover");
  try {
    const q = encodeURIComponent((artista + " " + titulo).replace(/\(.*?\)|\[.*?\]/g, ""));
    const r = await jsonp("https://itunes.apple.com/search?term=" + q + "&entity=song&limit=1");
    if (r.results && r.results[0]){
      const url = r.results[0].artworkUrl100.replace("100x100", "600x600");
      cover.onload = () => { cover.style.opacity = 1; $("icono").style.opacity = 0; };
      cover.src = url;
      $("bg").style.backgroundImage = "url('" + url + "')";
      if ("mediaSession" in navigator && navigator.mediaSession.metadata){
        navigator.mediaSession.metadata.artwork = [{ src: url, sizes: "600x600", type: "image/jpeg" }];
      }
      return;
    }
  } catch(e){}
  cover.style.opacity = 0; $("icono").style.opacity = .9; $("bg").style.backgroundImage = "";
}

if ("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",  reproducir);
  navigator.mediaSession.setActionHandler("pause", detener);
  navigator.mediaSession.setActionHandler("stop",  detener);
}

actualizar();
setInterval(actualizar, REFRESCO);
</script>
</body>
</html>
